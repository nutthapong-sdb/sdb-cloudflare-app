services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: sdb-nginx
    ports:
      - "8002:80"
    depends_on:
      - app
      - chrome-browser
    restart: unless-stopped

  app:
    container_name: sdb-cloudflare-app
    build:
      context: .
      dockerfile: Dockerfile
    # Port 8002 is now exposed by Nginx
    # ports:
    #   - "8002:8002"

    environment:
      - NODE_ENV=production
      - CHROME_HOST=chrome-browser
    volumes:
      - ./db:/app/db
      - ./downloads:/app/app/data
    restart: unless-stopped
    depends_on:
      - chrome-browser

  chrome-browser:
    build:
      context: .
      dockerfile: Dockerfile.chrome
    container_name: sdb-chrome-browser
    ports:
      - "5800:5800"
    environment:
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      # The background report worker drives its own tab while the Cloudflare tab is in front.
      # Without the --disable-background* flags Chrome throttles the hidden worker tab's timers
      # (1s -> ~1 min), so the 21 steps and the Word export crawl until the job times out.
      - CHROME_CUSTOM_ARGS=--window-size=1920,1080 --window-position=0,0 --start-maximized --no-first-run --force-device-scale-factor=1 --disable-background-timer-throttling --disable-renderer-backgrounding --disable-backgrounding-occluded-windows
    volumes:
      - ./chrome-config:/config
      - ./docker-chrome-policy:/etc/chromium/policies:ro
      - ./docker-openbox/main-window-selection.xml:/etc/openbox/main-window-selection.xml:ro
    shm_size: 2gb
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
