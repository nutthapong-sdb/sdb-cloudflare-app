services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: sdb-nginx
    ports:
      - "8002:80"
    depends_on:
      - app
      - chrome-browser
    restart: unless-stopped

  app:
    container_name: sdb-cloudflare-app
    build:
      context: .
      dockerfile: Dockerfile
    # Port 8002 is now exposed by Nginx
    # ports:
    #   - "8002:8002"

    environment:
      - NODE_ENV=production
      - CHROME_HOST=chrome-browser
    volumes:
      - sdb-cloudflare-db:/app/db
      - sdb-cloudflare-data:/app/app/data
    restart: unless-stopped
    depends_on:
      - chrome-browser

  chrome-browser:
    image: maelp/docker-vnc-chromium:latest
    container_name: sdb-chrome-browser
    ports:
      - "5800:5800"
    environment:
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
    volumes:
      - sdb-chrome-config:/config
    shm_size: 2gb
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped

volumes:
  sdb-cloudflare-db:
  sdb-cloudflare-data:
  sdb-chrome-config:
